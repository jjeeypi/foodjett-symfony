name: ${COMPOSE_PROJECT_NAME:-foodjett}

x-api-environment: &api-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the root .env file}
  DATABASE_URL: mysql://${MARIADB_USER:?Set MARIADB_USER in .env}:${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:?Set MARIADB_DATABASE in .env}?serverVersion=mariadb-10.4.32&charset=utf8mb4
  DEFAULT_URI: ${API_PUBLIC_URL:-http://localhost:8000}
  JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
  JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?Set JWT_PASSPHRASE in the root .env file}
  MAILER_DSN: null://null
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}/.well-known/mercure
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env file}
  CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$

services:
  mariadb:
    image: mariadb:10.4.32
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE in the root .env file}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in the root .env file}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in the root .env file}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in the root .env file}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_TRUSTED_ISSUERS: foodjett-api
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env file}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env file}
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cookie_name mercure_access_token
        resource_identifier ${PUBLIC_WEB_URL:-http://localhost:8080}/.well-known/mercure
        cors_origins ${PUBLIC_WEB_URL:-http://localhost:8080} http://localhost:${WEB_PORT:-8080} http://127.0.0.1:${WEB_PORT:-8080}
    ports:
      - "${MERCURE_PORT:-3000}:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/mercure/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  api:
    image: foodjett-api:local
    build:
      context: ./api
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      mariadb:
        condition: service_healthy
      mercure:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - api_jwt_keys:/var/www/html/config/jwt
      - api_uploads:/var/www/html/public/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  scheduler:
    image: foodjett-api:local
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "0"
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--no-interaction", "--memory-limit=128M"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - api_jwt_keys:/var/www/html/config/jwt
    networks: [foodjett]

  web:
    image: foodjett-web:local
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mercure:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [foodjett]

volumes:
  mariadb_data:
  mercure_data:
  mercure_config:
  api_jwt_keys:
  api_uploads:

networks:
  foodjett:
    driver: bridge
