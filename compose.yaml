name: ${COMPOSE_PROJECT_NAME:-foodjett}

# Secrets (database credentials, APP_SECRET, JWT_PASSPHRASE, Mercure keys) come
# from the gitignored .env.docker.local; copy .env.docker.example to create it.
x-secrets: &secrets
  env_file:
    - path: .env.docker.local
      required: true

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  DEFAULT_URI: ${PUBLIC_WEB_URL:-http://localhost:8080}
  JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
  JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
  MAILER_DSN: null://null
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}/.well-known/mercure
  CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$

services:
  mariadb:
    image: mariadb:10.4.32
    restart: unless-stopped
    <<: *secrets
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  mercure:
    image: dunglas/mercure:v1.1.0
    restart: unless-stopped
    <<: *secrets
    environment:
      SERVER_NAME: ":80"
      MERCURE_TRUSTED_ISSUERS: foodjett-api
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cookie_name mercure_access_token
        resource_identifier ${PUBLIC_WEB_URL:-http://localhost:8080}/.well-known/mercure
        cors_origins ${PUBLIC_WEB_URL:-http://localhost:8080} http://localhost:${WEB_PORT:-8080} http://127.0.0.1:${WEB_PORT:-8080}
    ports:
      - "${MERCURE_PORT:-3000}:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/mercure/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  app:
    image: foodjett-app:local
    build:
      context: .
    restart: unless-stopped
    <<: *secrets
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      mariadb:
        condition: service_healthy
      mercure:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - api_jwt_keys:/var/www/html/config/jwt
      - api_uploads:/var/www/html/public/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodjett]

  scheduler:
    image: foodjett-app:local
    restart: unless-stopped
    <<: *secrets
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--no-interaction", "--memory-limit=128M"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - api_jwt_keys:/var/www/html/config/jwt
    networks: [foodjett]

volumes:
  mariadb_data:
  mercure_data:
  mercure_config:
  api_jwt_keys:
  api_uploads:

networks:
  foodjett:
    driver: bridge
