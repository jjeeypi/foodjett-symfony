ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Preserve bearer tokens for Symfony Security when Apache runs PHP as a module.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    # Serve the Mercure hub from the same origin as the application so the
    # HttpOnly subscriber cookie and EventSource need no cross-origin setup.
    # flushpackets streams Server-Sent Events immediately instead of buffering.
    ProxyPreserveHost On
    ProxyPass        /.well-known/mercure http://mercure/.well-known/mercure flushpackets=on timeout=86400
    ProxyPassReverse /.well-known/mercure http://mercure/.well-known/mercure

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/html/public/uploads>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
